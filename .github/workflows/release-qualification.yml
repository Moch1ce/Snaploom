name: Release qualification

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact X.Y.Z release version
        required: true
        type: string
      commit:
        description: Full 40-character release commit SHA
        required: true
        type: string

concurrency:
  group: release-qualification-${{ inputs.commit }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  platform:
    name: Hosted platform (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-2025
            expected_arch: x86_64
          - platform: macos-arm64
            os: macos-15
            expected_arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    environment: release-qualification

    steps:
      - name: Validate immutable release identity
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ inputs.commit }}
        run: |
          [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "${COMMIT}" =~ ^[0-9a-f]{40}$ ]]

      - name: Checkout exact release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false

      - name: Verify hosted runner architecture
        shell: bash
        run: test "$(uname -m)" = "${{ matrix.expected_arch }}"

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.12.0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.17.0
          run_install: false

      - name: Setup Rust
        shell: bash
        run: rustup toolchain install 1.97.1 --profile minimal

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile Windows product tests
        if: runner.os == 'Windows'
        shell: bash
        run: cargo test --manifest-path product/Cargo.toml --workspace --all-features --locked --no-run

      - name: Install pinned Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco upgrade innosetup --version=6.7.1 --allow-downgrade --yes --no-progress

      - name: Build and verify Windows candidate
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          ./scripts/build-windows-packages.ps1 -Version $env:VERSION -SigningMode candidate-unsigned
          ./tests/packaging/verify-windows-packages.ps1 `
            -Directory ./artifacts/release/windows-x64 `
            -Version $env:VERSION `
            -ExpectedSigning candidate-unsigned

      - name: Test macOS product and build candidate
        if: runner.os == 'macOS'
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          MACOSX_DEPLOYMENT_TARGET: "14.0"
        run: |
          cargo test --manifest-path product/Cargo.toml --workspace --all-features --locked
          ./scripts/build-macos-packages.sh --version "${VERSION}" --adhoc
          ./tests/packaging/verify-macos-packages.sh \
            --directory ./artifacts/release/macos-arm64 \
            --version "${VERSION}" \
            --expected-signing adhoc

      - name: Verify release contract tooling
        run: pnpm run check:release

      - name: Record GitHub-hosted qualification evidence
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          RUNNER_IMAGE: ${{ matrix.os }}
          EXPECTED_ARCH: ${{ matrix.expected_arch }}
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ inputs.commit }}
        run: |
          mkdir -p artifacts/qualification
          node tools/release/create-hosted-qualification-evidence.mjs \
            --output "artifacts/qualification/${PLATFORM}.json" \
            --platform "${PLATFORM}" --runner-image "${RUNNER_IMAGE}" \
            --architecture "${EXPECTED_ARCH}" --version "${VERSION}" --commit "${COMMIT}"

      - name: Upload hosted qualification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: qualification-${{ matrix.platform }}
          path: artifacts/qualification/${{ matrix.platform }}.json
          if-no-files-found: error
          retention-days: 30

  qualification-set:
    name: Complete hosted platform gate
    needs: platform
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout verifier
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false

      - name: Download all qualified evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: qualification-*
          path: artifacts/qualification
          merge-multiple: true

      - name: Require the complete hosted platform set
        run: >-
          node tools/release/verify-qualification-set.mjs
          --directory artifacts/qualification
          --version '${{ inputs.version }}'
          --commit '${{ inputs.commit }}'
