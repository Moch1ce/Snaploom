name: Signed legal RC draft

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact unused X.Y.Z release version
        required: true
        type: string
      commit:
        description: Full 40-character commit on main and at vX.Y.Z
        required: true
        type: string
      ci_run_id:
        description: Successful full CI run for the exact commit
        required: true
        type: string
      qualification_run_id:
        description: Successful Release qualification run for the exact commit
        required: true
        type: string

concurrency:
  group: signed-legal-rc-${{ inputs.version }}-${{ inputs.commit }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate immutable RC subject
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.12.0

      - name: Require an exact immutable tag on main and no existing release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ inputs.commit }}
        run: |
          test "${GITHUB_REF}" = "refs/heads/main"
          [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "${COMMIT}" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "${COMMIT}"
          node tools/release/check-release-version.mjs --version "${VERSION}"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "${COMMIT}" origin/main
          git fetch origin "refs/tags/v${VERSION}:refs/tags/v${VERSION}"
          test "$(git rev-list -n 1 "v${VERSION}")" = "${COMMIT}"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --paginate --slurp --jq \
            "[.[][] | select(.tag_name == \"v${VERSION}\")] | length")" = 0

      - name: Read required CI and qualification runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          QUALIFICATION_RUN_ID: ${{ inputs.qualification_run_id }}
        run: |
          mkdir -p "${RUNNER_TEMP}/identity"
          gh run view "${CI_RUN_ID}" --repo "${GITHUB_REPOSITORY}" \
            --json databaseId,url,workflowName,headSha,conclusion,jobs \
            > "${RUNNER_TEMP}/identity/ci-run.json"
          gh run view "${QUALIFICATION_RUN_ID}" --repo "${GITHUB_REPOSITORY}" \
            --json databaseId,url,workflowName,headSha,conclusion,jobs \
            > "${RUNNER_TEMP}/identity/qualification-run.json"
          gh run view "${CI_RUN_ID}" --repo "${GITHUB_REPOSITORY}" --log \
            > "${RUNNER_TEMP}/identity/ci-run.log"
          gh run view "${QUALIFICATION_RUN_ID}" --repo "${GITHUB_REPOSITORY}" --log \
            > "${RUNNER_TEMP}/identity/qualification-run.log"
          node tools/release/verify-run-evidence.mjs \
            --ci-run "${RUNNER_TEMP}/identity/ci-run.json" \
            --qualification-run "${RUNNER_TEMP}/identity/qualification-run.json" \
            --commit '${{ inputs.commit }}'

      - name: Download GitHub-hosted qualification evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: qualification-*
          path: ${{ runner.temp }}/identity/qualification
          merge-multiple: true
          run-id: ${{ inputs.qualification_run_id }}
          github-token: ${{ github.token }}

      - name: Re-evaluate the exact qualification set
        run: >-
          node tools/release/verify-qualification-set.mjs
          --directory '${{ runner.temp }}/identity/qualification'
          --version '${{ inputs.version }}'
          --commit '${{ inputs.commit }}'

      - name: Preserve validated release identity
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: legal-rc-validated-identity
          path: ${{ runner.temp }}/identity
          if-no-files-found: error
          retention-days: 30

  windows-sign:
    name: Authenticode products and Windows SDK
    needs: validate
    runs-on: windows-2025
    timeout-minutes: 45
    environment: release-signing
    permissions:
      contents: read

    steps:
      - name: Checkout verified tag commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.12.0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.17.0
          run_install: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13.14"

      - name: Setup Rust and frontend dependencies
        shell: bash
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          pnpm install --frozen-lockfile

      - name: Install pinned Inno Setup
        shell: pwsh
        run: choco upgrade innosetup --version=6.7.1 --allow-downgrade --yes --no-progress

      - name: Build, Authenticode-sign, timestamp, and verify Windows assets
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
          WINDOWS_RFC3161_TIMESTAMP_URL: ${{ secrets.WINDOWS_RFC3161_TIMESTAMP_URL }}
          VERSION: ${{ inputs.version }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERTIFICATE_BASE64)) {
              throw 'WINDOWS_SIGNING_CERTIFICATE_BASE64 is required in release-signing.'
          }
          $certificate = Join-Path $env:RUNNER_TEMP 'snaploom-signing.pfx'
          [System.IO.File]::WriteAllBytes(
              $certificate,
              [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERTIFICATE_BASE64))
          $env:WINDOWS_SIGNING_CERTIFICATE_PATH = $certificate
          $env:RUSTFLAGS = "--remap-path-prefix=$env:GITHUB_WORKSPACE=."
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vsInstall = (& $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath).Trim()
          $vsDevCmd = Join-Path $vsInstall 'Common7\Tools\VsDevCmd.bat'
          if (-not (Test-Path $vsDevCmd -PathType Leaf)) { throw 'Pinned Visual Studio build environment is unavailable.' }
          $devCommand = "call `"$vsDevCmd`" -no_logo -arch=x64 -host_arch=x64 -winsdk=10.0.26100.0 && set"
          & $env:ComSpec /d /s /c $devCommand | ForEach-Object {
              if ($_ -match '^([^=]+)=(.*)$') {
                  Set-Item -Path "Env:$($Matches[1])" -Value $Matches[2]
              }
          }
          if ($LASTEXITCODE -ne 0) { throw 'VsDevCmd failed to select Windows SDK 10.0.26100.0.' }
          $selectedWindowsSdk = $env:WindowsSDKVersion.TrimEnd('\')
          if ($selectedWindowsSdk -ne '10.0.26100.0') {
              throw "Unexpected Windows SDK selected for build: $selectedWindowsSdk"
          }
          Set-Content (Join-Path $env:RUNNER_TEMP 'windows-sdk-version.txt') `
            $selectedWindowsSdk -NoNewline
          $signTool = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin\10.0.26100.0\x64\signtool.exe'
          if (-not (Test-Path $signTool -PathType Leaf)) { throw 'Pinned Windows SDK 10.0.26100.0 is unavailable.' }
          cargo build --manifest-path sdk/Cargo.toml --package snaploom-capture-c-abi --release --locked
          & ./scripts/build-windows-packages.ps1 `
            -Version $env:VERSION `
            -SigningMode stable-signed `
            -SignTool $signTool `
            -CaptureSdkDllPath 'sdk/target/release/snaploom_capture.dll' `
            *>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/windows-signing.log"
          & ./tests/packaging/verify-windows-packages.ps1 `
            -Directory ./artifacts/release/windows-x64 `
            -Version $env:VERSION `
            -ExpectedSigning stable-signed `
            *>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/windows-signing.log" -Append
          if ((Get-AuthenticodeSignature ./sdk/target/release/snaploom_capture.dll).Status -ne 'Valid') {
              throw 'Windows Capture SDK DLL does not have a valid Authenticode signature.'
          }
          $dumpbin = (node --input-type=module --eval `
            "import { findDumpbin } from './tools/sdk/windows-tools.mjs'; console.log(findDumpbin());").Trim()
          & $dumpbin /exports ./sdk/target/release/snaploom_capture.dll `
            *>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/windows-binary-inspection.log"
          if ($LASTEXITCODE -ne 0) { throw 'dumpbin /exports failed.' }
          & $dumpbin /dependents ./sdk/target/release/snaploom_capture.dll `
            *>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/windows-binary-inspection.log" -Append
          if ($LASTEXITCODE -ne 0) { throw 'dumpbin /dependents failed.' }
          Get-AuthenticodeSignature ./sdk/target/release/snaploom_capture.dll | `
            Format-List * | Out-File "$env:RUNNER_TEMP/windows-binary-inspection.log" -Append -Encoding utf8
          $archive = node tools/sdk/package-c-sdk.mjs `
            --platform windows-x64 --version $env:VERSION `
            --output "$env:RUNNER_TEMP/snaploom-windows-c-sdk"
          python -m zipfile -l $archive 2>&1 | `
            Out-File "$env:RUNNER_TEMP/windows-binary-inspection.log" -Append -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'Windows C SDK archive listing failed.' }
          node tools/sdk/verify-c-sdk.mjs --platform windows-x64 --archive $archive `
            2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/windows-c-cpp-consumer.log"
          if ($LASTEXITCODE -ne 0) { throw 'Windows C/C++ consumer verification failed.' }
          New-Item "$env:RUNNER_TEMP/snaploom-windows-native" -ItemType Directory -Force | Out-Null
          Copy-Item ./sdk/target/release/snaploom_capture.dll "$env:RUNNER_TEMP/snaploom-windows-native/"

      - name: Record Windows builder identity
        shell: pwsh
        run: |
          $record = [ordered]@{
              imageOS = $env:ImageOS
              imageVersion = $env:ImageVersion
              runnerArchitecture = $env:RUNNER_ARCH
              node = (node --version)
              pnpm = (pnpm --version)
              python = (python --version)
              rustc = (rustc --version)
              cargo = (cargo --version)
              windowsSdk = (Get-Content (Join-Path $env:RUNNER_TEMP 'windows-sdk-version.txt') -Raw)
              signTool = (Get-Item (Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin\10.0.26100.0\x64\signtool.exe')).VersionInfo.FileVersion
          }
          [System.IO.File]::WriteAllText(
              (Join-Path $env:RUNNER_TEMP 'windows-builder.json'),
              (($record | ConvertTo-Json) + "`n"),
              [System.Text.UTF8Encoding]::new($false))

      - name: Remove the ephemeral signing certificate
        if: always()
        shell: pwsh
        run: Remove-Item (Join-Path $env:RUNNER_TEMP 'snaploom-signing.pfx') -Force -ErrorAction SilentlyContinue

      - name: Upload verified signed Windows assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: legal-rc-windows-signed
          path: |
            artifacts/release/windows-x64/*
            ${{ runner.temp }}/snaploom-windows-c-sdk/*
            ${{ runner.temp }}/snaploom-windows-native/snaploom_capture.dll
            ${{ runner.temp }}/windows-builder.json
            ${{ runner.temp }}/windows-signing.log
            ${{ runner.temp }}/windows-c-cpp-consumer.log
            ${{ runner.temp }}/windows-binary-inspection.log
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  macos-sign-notary:
    name: Developer ID and notarized macOS products
    needs: validate
    runs-on: macos-15
    timeout-minutes: 60
    environment: release-signing
    permissions:
      contents: read

    steps:
      - name: Checkout verified tag commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false

      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = arm64

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.12.0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.17.0
          run_install: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13.14"

      - name: Setup Rust and frontend dependencies
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          pnpm install --frozen-lockfile

      - name: Select pinned Xcode and Swift toolchain
        shell: bash
        run: |
          sudo xcode-select --switch /Applications/Xcode_16.4.app/Contents/Developer
          test "$(xcodebuild -version | sed -n '1p')" = "Xcode 16.4"
          test "$(xcodebuild -version | sed -n '2p')" = "Build version 16F6"
          xcodebuild -version
          swift --version

      - name: Build macOS C SDK and Swift XCFramework
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          export MACOSX_DEPLOYMENT_TARGET=14.0
          export RUSTFLAGS="--remap-path-prefix=${GITHUB_WORKSPACE}=. --remap-path-prefix=/Users/runner/=user/"
          cargo build --manifest-path sdk/Cargo.toml --package snaploom-capture-c-abi --release --locked
          c_archive="$(node tools/sdk/package-c-sdk.mjs \
            --platform macos-arm64 --version "${VERSION}" \
            --output "${RUNNER_TEMP}/snaploom-macos-c-sdk")"
          node tools/sdk/verify-c-sdk.mjs --platform macos-arm64 --archive "${c_archive}" \
            2>&1 | tee "${RUNNER_TEMP}/macos-c-cpp-consumer.log"
          swift_archive="${RUNNER_TEMP}/snaploom-swift-sdk/CSnaploomCapture-${VERSION}.xcframework.zip"
          node tools/sdk/package-swift-sdk.mjs \
            --version "${VERSION}" \
            --library sdk/target/release/libsnaploom_capture.dylib \
            --output "${RUNNER_TEMP}/snaploom-swift-sdk"
          node tools/sdk/verify-swift-sdk.mjs --version "${VERSION}" --archive "${swift_archive}" \
            2>&1 | tee "${RUNNER_TEMP}/macos-swift-consumer.log"
          {
            nm -gU sdk/target/release/libsnaploom_capture.dylib
            otool -L sdk/target/release/libsnaploom_capture.dylib
            otool -l sdk/target/release/libsnaploom_capture.dylib
            tar -tzf "${c_archive}"
            unzip -l "${swift_archive}"
          } > "${RUNNER_TEMP}/macos-binary-inspection.log" 2>&1
          mkdir -p "${RUNNER_TEMP}/snaploom-macos-native"
          cp sdk/target/release/libsnaploom_capture.dylib "${RUNNER_TEMP}/snaploom-macos-native/"

      - name: Import ephemeral Developer ID identity, package, notarize, and verify
        shell: bash
        env:
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_DEVELOPER_IDENTITY: ${{ secrets.APPLE_DEVELOPER_IDENTITY }}
          APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          VERSION: ${{ inputs.version }}
        run: |
          : "${APPLE_DEVELOPER_ID_P12_BASE64:?missing Developer ID certificate}"
          : "${APPLE_DEVELOPER_ID_P12_PASSWORD:?missing Developer ID password}"
          : "${APPLE_DEVELOPER_IDENTITY:?missing Developer ID identity}"
          : "${APPLE_NOTARY_KEY_BASE64:?missing App Store Connect API key}"
          : "${APPLE_NOTARY_KEY_ID:?missing App Store Connect key ID}"
          : "${APPLE_NOTARY_ISSUER_ID:?missing App Store Connect issuer ID}"
          keychain="${RUNNER_TEMP}/snaploom-signing.keychain-db"
          certificate="${RUNNER_TEMP}/snaploom-developer-id.p12"
          export APPLE_NOTARY_KEY_PATH="${RUNNER_TEMP}/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          python3 - "${certificate}" "${APPLE_NOTARY_KEY_PATH}" <<'PY'
          import base64, os, sys
          open(sys.argv[1], "wb").write(base64.b64decode(os.environ["APPLE_DEVELOPER_ID_P12_BASE64"], validate=True))
          open(sys.argv[2], "wb").write(base64.b64decode(os.environ["APPLE_NOTARY_KEY_BASE64"], validate=True))
          PY
          chmod 600 "${certificate}" "${APPLE_NOTARY_KEY_PATH}"
          keychain_password="$(openssl rand -hex 32)"
          security create-keychain -p "${keychain_password}" "${keychain}"
          security set-keychain-settings -lut 21600 "${keychain}"
          security unlock-keychain -p "${keychain_password}" "${keychain}"
          security import "${certificate}" -k "${keychain}" \
            -P "${APPLE_DEVELOPER_ID_P12_PASSWORD}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "${keychain_password}" "${keychain}"
          security list-keychains -d user -s "${keychain}"
          ./scripts/build-macos-packages.sh \
            --version "${VERSION}" \
            --developer-id "${APPLE_DEVELOPER_IDENTITY}" \
            --notarize 2>&1 | tee "${RUNNER_TEMP}/macos-signing.log"
          ./tests/packaging/verify-macos-packages.sh \
            --directory ./artifacts/release/macos-arm64 \
            --version "${VERSION}" \
            --expected-signing developer-id 2>&1 | tee -a "${RUNNER_TEMP}/macos-signing.log"

      - name: Record macOS builder identity
        shell: bash
        run: |
          jq -n \
            --arg imageOS "${ImageOS}" \
            --arg imageVersion "${ImageVersion}" \
            --arg runnerArchitecture "${RUNNER_ARCH}" \
            --arg node "$(node --version)" \
            --arg pnpm "$(pnpm --version)" \
            --arg python "$(python3 --version)" \
            --arg rustc "$(rustc --version)" \
            --arg cargo "$(cargo --version)" \
            --arg xcode "$(xcodebuild -version | tr '\n' ' ')" \
            --arg swift "$(swift --version | tr '\n' ' ')" \
            '{imageOS:$imageOS,imageVersion:$imageVersion,runnerArchitecture:$runnerArchitecture,node:$node,pnpm:$pnpm,python:$python,rustc:$rustc,cargo:$cargo,xcode:$xcode,swift:$swift}' \
            > "${RUNNER_TEMP}/macos-builder.json"

      - name: Remove ephemeral Apple signing material
        if: always()
        shell: bash
        run: |
          security list-keychains -d user -s login.keychain-db 2>/dev/null || true
          security delete-keychain "${RUNNER_TEMP}/snaploom-signing.keychain-db" 2>/dev/null || true
          rm -f "${RUNNER_TEMP}/snaploom-developer-id.p12" "${RUNNER_TEMP}"/AuthKey_*.p8

      - name: Upload verified signed macOS and SDK assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: legal-rc-macos-signed
          path: |
            artifacts/release/macos-arm64/*
            ${{ runner.temp }}/snaploom-macos-c-sdk/*
            ${{ runner.temp }}/snaploom-swift-sdk/*
            ${{ runner.temp }}/snaploom-macos-native/libsnaploom_capture.dylib
            ${{ runner.temp }}/macos-builder.json
            ${{ runner.temp }}/macos-signing.log
            ${{ runner.temp }}/macos-c-cpp-consumer.log
            ${{ runner.temp }}/macos-swift-consumer.log
            ${{ runner.temp }}/macos-binary-inspection.log
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  dotnet-package:
    name: Package signed dual-RID NuGet
    needs:
      - windows-sign
      - macos-sign-notary
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout verified tag commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.12.0

      - name: Setup .NET 8
        id: setup-dotnet
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 8.0.423

      - name: Download signed native assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: legal-rc-*-signed
          path: ${{ runner.temp }}/signed-input

      - name: Pack and verify NuGet from the signed Windows DLL
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          windows_native="$(find "${RUNNER_TEMP}/signed-input" -name snaploom_capture.dll -type f -print -quit)"
          macos_native="$(find "${RUNNER_TEMP}/signed-input" -name libsnaploom_capture.dylib -type f -print -quit)"
          test -n "${windows_native}"
          test -n "${macos_native}"
          dotnet restore sdk/dotnet/src/Snaploom.Capture/Snaploom.Capture.csproj --locked-mode
          dotnet pack sdk/dotnet/src/Snaploom.Capture/Snaploom.Capture.csproj \
            -c Release --output "${RUNNER_TEMP}/snaploom-nuget" \
            -p:ContinuousIntegrationBuild=true \
            -p:SnaploomWindowsNativePath="${windows_native}" \
            -p:SnaploomMacOSNativePath="${macos_native}"
          package="${RUNNER_TEMP}/snaploom-nuget/Snaploom.Capture.${VERSION}.nupkg"
          test -f "${package}"
          test -f "${RUNNER_TEMP}/snaploom-nuget/Snaploom.Capture.${VERSION}.snupkg"
          node tools/sdk/verify-dotnet-package.mjs \
            --package "${package}" --platform unsupported \
            --sdk-version "${{ steps.setup-dotnet.outputs.dotnet-version }}" \
            --windows-native "${windows_native}" --macos-native "${macos_native}"
          {
            unzip -l "${package}"
            unzip -l "${RUNNER_TEMP}/snaploom-nuget/Snaploom.Capture.${VERSION}.snupkg"
          } > "${RUNNER_TEMP}/nuget-package-listing.log"
          jq -n \
            --arg imageOS "${ImageOS}" \
            --arg imageVersion "${ImageVersion}" \
            --arg runnerArchitecture "${RUNNER_ARCH}" \
            --arg node "$(node --version)" \
            --arg dotnet "$(dotnet --version)" \
            '{imageOS:$imageOS,imageVersion:$imageVersion,runnerArchitecture:$runnerArchitecture,node:$node,dotnet:$dotnet}' \
            > "${RUNNER_TEMP}/dotnet-builder.json"

      - name: Upload signed dual-RID NuGet
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: legal-rc-nuget
          path: |
            ${{ runner.temp }}/snaploom-nuget/Snaploom.Capture.*.nupkg
            ${{ runner.temp }}/snaploom-nuget/Snaploom.Capture.*.snupkg
            ${{ runner.temp }}/dotnet-builder.json
            ${{ runner.temp }}/nuget-package-listing.log
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  dotnet-consumer:
    name: .NET signed consumer (${{ matrix.platform }}, ${{ matrix.framework }})
    needs: dotnet-package
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-2025
            framework: net8.0
            dotnet_version: 8.0.423
          - platform: macos-arm64
            os: macos-15
            framework: net8.0
            dotnet_version: 8.0.423
          - platform: windows-x64
            os: windows-2025
            framework: net10.0
            dotnet_version: 10.0.302
          - platform: macos-arm64
            os: macos-15
            framework: net10.0
            dotnet_version: 10.0.302
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout verified tag commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.12.0

      - name: Setup exact .NET SDK
        id: setup-dotnet
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: ${{ matrix.dotnet_version }}

      - name: Download final signed NuGet package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: legal-rc-nuget
          path: ${{ runner.temp }}/snaploom-nuget

      - name: Verify package-only build, run, trim, and NativeAOT
        shell: bash
        run: |
          package="${RUNNER_TEMP}/snaploom-nuget/Snaploom.Capture.${{ inputs.version }}.nupkg"
          test -f "${package}"
          dotnet --info
          node tools/sdk/verify-dotnet-package.mjs \
            --package "${package}" \
            --platform '${{ matrix.platform }}' \
            --framework '${{ matrix.framework }}' \
            --sdk-version '${{ steps.setup-dotnet.outputs.dotnet-version }}' 2>&1 | \
            tee "${RUNNER_TEMP}/dotnet-${{ matrix.platform }}-${{ matrix.framework }}-consumer.log"

      - name: Upload final signed consumer evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: legal-rc-dotnet-consumer-${{ matrix.platform }}-${{ matrix.framework }}
          path: ${{ runner.temp }}/dotnet-${{ matrix.platform }}-${{ matrix.framework }}-consumer.log
          if-no-files-found: error
          retention-days: 30

  assemble:
    name: Assemble exact stable-signed asset set
    needs:
      - validate
      - windows-sign
      - macos-sign-notary
      - dotnet-package
      - dotnet-consumer
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout verified tag commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.12.0

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13.14"

      - name: Download all signed platform and SDK assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: legal-rc-*
          path: ${{ runner.temp }}/legal-rc-input

      - name: Collect payloads, rebuild source, and generate release materials
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ inputs.commit }}
        run: |
          node tools/release/collect-payloads.mjs \
            --input "${RUNNER_TEMP}/legal-rc-input" \
            --output "${RUNNER_TEMP}/release-payloads" \
            --version "${VERSION}"
          first="${RUNNER_TEMP}/release-payloads/snaploom-${VERSION}-corresponding-source.tar.zst"
          second="${RUNNER_TEMP}/source-rebuild.tar.zst"
          ./scripts/build-corresponding-source.sh \
            --version "${VERSION}" --commit "${COMMIT}" --output "${first}"
          ./scripts/build-corresponding-source.sh \
            --version "${VERSION}" --commit "${COMMIT}" --output "${second}"
          cmp "${first}" "${second}"
          ./tests/packaging/verify-corresponding-source.sh \
            --archive "${first}" --version "${VERSION}"
          node tools/release/generate-release-materials.mjs \
            --directory "${RUNNER_TEMP}/release-payloads" --version "${VERSION}"

      - name: Assemble and verify stable signing evidence and exact files
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ inputs.commit }}
        run: |
          windows_metadata="$(find "${RUNNER_TEMP}/legal-rc-input" -name windows-package-metadata.json -type f -print -quit)"
          macos_metadata="$(find "${RUNNER_TEMP}/legal-rc-input" -name macos-package-metadata.json -type f -print -quit)"
          test -n "${windows_metadata}"
          test -n "${macos_metadata}"
          node tools/release/create-signing-evidence.mjs \
            --windows-metadata "${windows_metadata}" \
            --macos-metadata "${macos_metadata}" \
            --output "${RUNNER_TEMP}/signing-evidence.json"
          node tools/release/assemble-release.mjs \
            --payloads "${RUNNER_TEMP}/release-payloads" \
            --output "${RUNNER_TEMP}/release-assets" \
            --version "${VERSION}" --tag "v${VERSION}" --commit "${COMMIT}" \
            --mode stable-signed --run-id "${GITHUB_RUN_ID}" \
            --signing-evidence "${RUNNER_TEMP}/signing-evidence.json"
          node tools/release/verify-release.mjs \
            --directory "${RUNNER_TEMP}/release-assets" --version "${VERSION}"
          mkdir -p "${RUNNER_TEMP}/legal-rc-stage/platform" "${RUNNER_TEMP}/legal-rc-stage/identity"
          cp -R "${RUNNER_TEMP}/release-assets" "${RUNNER_TEMP}/legal-rc-stage/"
          cp "${windows_metadata}" "${RUNNER_TEMP}/legal-rc-stage/platform/windows-package-metadata.json"
          cp "${macos_metadata}" "${RUNNER_TEMP}/legal-rc-stage/platform/macos-package-metadata.json"
          windows_builder="$(find "${RUNNER_TEMP}/legal-rc-input" -name windows-builder.json -type f -print -quit)"
          macos_builder="$(find "${RUNNER_TEMP}/legal-rc-input" -name macos-builder.json -type f -print -quit)"
          dotnet_builder="$(find "${RUNNER_TEMP}/legal-rc-input" -name dotnet-builder.json -type f -print -quit)"
          apple_evidence="$(find "${RUNNER_TEMP}/legal-rc-input" -name signing-evidence -type d -print -quit)"
          test -n "${windows_builder}"
          test -n "${macos_builder}"
          test -n "${dotnet_builder}"
          test -n "${apple_evidence}"
          cp "${windows_builder}" "${RUNNER_TEMP}/legal-rc-stage/platform/windows-builder.json"
          cp "${macos_builder}" "${RUNNER_TEMP}/legal-rc-stage/platform/macos-builder.json"
          cp "${dotnet_builder}" "${RUNNER_TEMP}/legal-rc-stage/platform/dotnet-builder.json"
          cp -R "${apple_evidence}" "${RUNNER_TEMP}/legal-rc-stage/platform/apple-signing-evidence"
          mkdir -p "${RUNNER_TEMP}/legal-rc-stage/platform/consumer-logs"
          mapfile -t consumer_logs < <(find "${RUNNER_TEMP}/legal-rc-input" -name '*-consumer.log' -type f -print)
          test "${#consumer_logs[@]}" -eq 7
          for log in "${consumer_logs[@]}"; do
            cp "${log}" "${RUNNER_TEMP}/legal-rc-stage/platform/consumer-logs/$(basename "${log}")"
          done
          windows_signing_log="$(find "${RUNNER_TEMP}/legal-rc-input" -name windows-signing.log -type f -print -quit)"
          macos_signing_log="$(find "${RUNNER_TEMP}/legal-rc-input" -name macos-signing.log -type f -print -quit)"
          test -n "${windows_signing_log}"
          test -n "${macos_signing_log}"
          cp "${windows_signing_log}" "${RUNNER_TEMP}/legal-rc-stage/platform/windows-signing.log"
          cp "${macos_signing_log}" "${RUNNER_TEMP}/legal-rc-stage/platform/macos-signing.log"
          windows_inspection_log="$(find "${RUNNER_TEMP}/legal-rc-input" -name windows-binary-inspection.log -type f -print -quit)"
          macos_inspection_log="$(find "${RUNNER_TEMP}/legal-rc-input" -name macos-binary-inspection.log -type f -print -quit)"
          test -n "${windows_inspection_log}"
          test -n "${macos_inspection_log}"
          cp "${windows_inspection_log}" "${RUNNER_TEMP}/legal-rc-stage/platform/windows-binary-inspection.log"
          cp "${macos_inspection_log}" "${RUNNER_TEMP}/legal-rc-stage/platform/macos-binary-inspection.log"
          nuget_listing_log="$(find "${RUNNER_TEMP}/legal-rc-input" -name nuget-package-listing.log -type f -print -quit)"
          test -n "${nuget_listing_log}"
          cp "${nuget_listing_log}" "${RUNNER_TEMP}/legal-rc-stage/platform/nuget-package-listing.log"
          cp -R "${RUNNER_TEMP}/legal-rc-input/legal-rc-validated-identity/." \
            "${RUNNER_TEMP}/legal-rc-stage/identity/"

      - name: Upload exact stable-signed staging set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: legal-rc-stable-signed-stage
          path: ${{ runner.temp }}/legal-rc-stage
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  attest:
    name: Attest stable-signed payload provenance and SBOM
    needs: assemble
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      attestations: write
      contents: read
      id-token: write

    steps:
      - name: Download exact stable-signed staging set
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: legal-rc-stable-signed-stage
          path: ${{ runner.temp }}/legal-rc-stage

      - name: Attest final release file provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: ${{ runner.temp }}/legal-rc-stage/release-assets/*

      - name: Attest aggregate release SBOM
        uses: actions/attest-sbom@4651f806c01d8637787e274ac3bdf724ef169f34 # v3
        with:
          subject-path: ${{ runner.temp }}/legal-rc-stage/release-assets/*
          sbom-path: ${{ runner.temp }}/legal-rc-stage/release-assets/snaploom-${{ inputs.version }}-sbom.cdx.json

  create-draft:
    name: Create, redownload, and verify invisible draft
    needs:
      - validate
      - attest
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release-draft
    permissions:
      actions: read
      contents: write

    steps:
      - name: Checkout verifier at the release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.12.0

      - name: Download exact stable-signed staging set
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: legal-rc-stable-signed-stage
          path: ${{ runner.temp }}/legal-rc-stage

      - name: Preserve final signed consumer and attestation evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run view "${GITHUB_RUN_ID}" --repo "${GITHUB_REPOSITORY}" \
            --json databaseId,url,workflowName,headSha,conclusion,jobs \
            > "${RUNNER_TEMP}/legal-rc-stage/identity/legal-rc-run.json"
          node tools/release/verify-run-evidence.mjs \
            --ci-run "${RUNNER_TEMP}/legal-rc-stage/identity/ci-run.json" \
            --qualification-run "${RUNNER_TEMP}/legal-rc-stage/identity/qualification-run.json" \
            --legal-rc-run "${RUNNER_TEMP}/legal-rc-stage/identity/legal-rc-run.json" \
            --commit '${{ inputs.commit }}'

      - name: Create draft and upload each asset once
        id: draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ inputs.commit }}
        run: |
          assets="${RUNNER_TEMP}/legal-rc-stage/release-assets"
          node tools/release/verify-release.mjs --directory "${assets}" --version "${VERSION}"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --paginate --slurp --jq \
            "[.[][] | select(.tag_name == \"v${VERSION}\")] | length")" = 0
          jq -n \
            --arg tag "v${VERSION}" --arg commit "${COMMIT}" \
            --arg name "Snaploom ${VERSION}" \
            --arg body "Snaploom ${VERSION} provides GPL-3.0-or-later Desktop and Capture Host assets plus separately licensed Apache-2.0 Capture SDK assets. The Apache Capture SDK communicates with a separately distributed GPL-3.0-or-later Capture Host; IPC does not automatically eliminate GPL compliance obligations. Install or provide the Capture Host separately and review the included license, NOTICE, SBOM, source, and integration-risk materials before redistribution." \
            '{tag_name:$tag,target_commitish:$commit,name:$name,body:$body,draft:true,prerelease:false,generate_release_notes:false}' \
            > "${RUNNER_TEMP}/create-release.json"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/releases" \
            --input "${RUNNER_TEMP}/create-release.json" \
            > "${RUNNER_TEMP}/created-release.json"
          release_id="$(jq -r .id "${RUNNER_TEMP}/created-release.json")"
          upload_url="$(jq -r '.upload_url | sub("\\{.*$"; "")' "${RUNNER_TEMP}/created-release.json")"
          for asset in "${assets}"/*; do
            name="$(basename "${asset}")"
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --header "Content-Type: application/octet-stream" \
              --data-binary "@${asset}" "${upload_url}?name=${name}" >/dev/null
          done
          gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
            > "${RUNNER_TEMP}/uploaded-release.json"
          git fetch --force --no-tags origin \
            "refs/tags/v${VERSION}:refs/snaploom-legal-rc/v${VERSION}"
          resolved_tag_commit="$(git rev-list -n 1 "refs/snaploom-legal-rc/v${VERSION}")"
          test "${resolved_tag_commit}" = "${COMMIT}"
          jq --arg commit "${resolved_tag_commit}" '. + {resolved_tag_commit:$commit}' \
            "${RUNNER_TEMP}/uploaded-release.json" \
            > "${RUNNER_TEMP}/uploaded-release-subject.json"
          mv "${RUNNER_TEMP}/uploaded-release-subject.json" "${RUNNER_TEMP}/uploaded-release.json"
          echo "release_id=${release_id}" >> "${GITHUB_OUTPUT}"
          echo "draft_url=$(jq -r .html_url "${RUNNER_TEMP}/uploaded-release.json")" >> "${GITHUB_OUTPUT}"

      - name: Redownload GitHub-stored bytes and verify server digests
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ inputs.commit }}
        run: |
          mkdir "${RUNNER_TEMP}/release-redownload"
          jq -r '.assets[] | [.id, .name] | @tsv' "${RUNNER_TEMP}/uploaded-release.json" |
            while IFS=$'\t' read -r asset_id name; do
              gh api "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" \
                -H "Accept: application/octet-stream" \
                > "${RUNNER_TEMP}/release-redownload/${name}"
            done
          node tools/release/verify-draft-release.mjs \
            --release-json "${RUNNER_TEMP}/uploaded-release.json" \
            --directory "${RUNNER_TEMP}/release-redownload" \
            --version "${VERSION}" --commit "${COMMIT}"

      - name: Generate the immutable Issue 33 owner approval bundle
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ inputs.commit }}
        run: |
          node tools/release/create-owner-approval-bundle.mjs \
            --release-directory "${RUNNER_TEMP}/release-redownload" \
            --release-json "${RUNNER_TEMP}/uploaded-release.json" \
            --qualification-directory "${RUNNER_TEMP}/legal-rc-stage/identity/qualification" \
            --ci-run-json "${RUNNER_TEMP}/legal-rc-stage/identity/ci-run.json" \
            --qualification-run-json "${RUNNER_TEMP}/legal-rc-stage/identity/qualification-run.json" \
            --legal-rc-run-json "${RUNNER_TEMP}/legal-rc-stage/identity/legal-rc-run.json" \
            --ci-run-log "${RUNNER_TEMP}/legal-rc-stage/identity/ci-run.log" \
            --qualification-run-log "${RUNNER_TEMP}/legal-rc-stage/identity/qualification-run.log" \
            --windows-metadata "${RUNNER_TEMP}/legal-rc-stage/platform/windows-package-metadata.json" \
            --macos-metadata "${RUNNER_TEMP}/legal-rc-stage/platform/macos-package-metadata.json" \
            --platform-evidence-directory "${RUNNER_TEMP}/legal-rc-stage/platform" \
            --output "${RUNNER_TEMP}/issue-33-owner-approval" \
            --version "${VERSION}" --commit "${COMMIT}"
          cp "${RUNNER_TEMP}/uploaded-release.json" "${RUNNER_TEMP}/issue-33-owner-approval/github-draft.json"

      - name: Upload Issue 33 owner approval bundle without publishing the draft
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: snaploom-v${{ inputs.version }}-issue-33-owner-approval
          path: ${{ runner.temp }}/issue-33-owner-approval
          if-no-files-found: error
          retention-days: 90
          compression-level: 9

      - name: Record the intentionally blocked stable transition
        run: |
          echo "Draft verified at ${{ steps.draft.outputs.draft_url }}"
          echo "Stable publish remains blocked by Issue #33. This workflow has no publish transition."
