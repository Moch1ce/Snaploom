name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2025
          - name: macOS Apple Silicon
            os: macos-15
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Snaploom.sln

      - name: Build
        run: dotnet build Snaploom.sln --configuration Release --no-restore

      - name: Test macOS native frame orientation
        if: runner.os == 'macOS'
        run: bash tests/native/macos/run-frame-orientation-test.sh

      - name: Test
        run: dotnet test Snaploom.sln --configuration Release --no-build
