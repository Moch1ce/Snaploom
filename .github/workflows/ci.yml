name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2025
          - name: macOS Apple Silicon
            os: macos-15
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Snaploom.sln

      - name: Build
        run: dotnet build Snaploom.sln --configuration Release --no-restore

      - name: Test macOS native frame orientation
        if: runner.os == 'macOS'
        run: bash tests/native/macos/run-frame-orientation-test.sh

      - name: Test
        run: dotnet test Snaploom.sln --configuration Release --no-build

      - name: Build ad hoc macOS DMG
        if: runner.os == 'macOS'
        run: ./scripts/build-macos-dmg.sh --version 1.0.0 --adhoc

      - name: Verify ad hoc macOS DMG
        if: runner.os == 'macOS'
        run: ./tests/packaging/verify-macos-dmg.sh --dmg-directory ./artifacts/macos-arm64/dmg --version 1.0.0 --expected-signing adhoc

      - name: Upload macOS DMG
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: snaploom-macos-arm64-dmg
          path: artifacts/macos-arm64/dmg/*
          if-no-files-found: error

      - name: Install pinned Inno Setup
        if: runner.os == 'Windows'
        run: choco upgrade innosetup --version=6.7.1 --allow-downgrade --yes --no-progress

      - name: Build Windows user installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-windows-installer.ps1 -Version 1.0.0

      - name: Verify Windows user installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/packaging/verify-windows-installer.ps1 -InstallerDirectory ./artifacts/windows-x64/installer -Version 1.0.0

      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: snaploom-windows-x64-installer
          path: artifacts/windows-x64/installer/*
          if-no-files-found: error
