name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2025
          - name: macOS Apple Silicon
            os: macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.12.0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.0
          run_install: false

      - name: Setup Rust
        shell: bash
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify licensing
        shell: bash
        run: |
          python -m pip install reuse==6.2.0
          reuse lint

      - name: Verify dependency direction
        run: pnpm run check:boundaries

      - name: Format Rust
        shell: bash
        run: |
          cargo fmt --manifest-path sdk/Cargo.toml --all -- --check
          cargo fmt --manifest-path product/Cargo.toml --all -- --check

      - name: Lint Rust
        shell: bash
        run: |
          cargo clippy --manifest-path sdk/Cargo.toml --workspace --all-targets --locked -- -D warnings
          cargo clippy --manifest-path product/Cargo.toml --workspace --all-targets --locked -- -D warnings

      - name: Test Rust
        shell: bash
        run: |
          cargo test --manifest-path sdk/Cargo.toml --workspace --locked
          cargo test --manifest-path product/Cargo.toml --workspace --locked

      - name: Verify frontend
        run: pnpm run check

      - name: Build Desktop Tauri binary
        run: pnpm run tauri:desktop

      - name: Build Capture Host Tauri binary
        run: pnpm run tauri:host
