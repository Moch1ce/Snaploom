name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  supply-chain:
    name: Rust supply chain
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.12.0

      - name: Setup Rust
        run: rustup toolchain install 1.97.1 --profile minimal

      - name: Audit binding generator Rust licenses and sources
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: Cargo.toml
          command: check bans licenses sources
          arguments: --all-features --locked

      - name: Audit product Rust licenses and sources
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: product/Cargo.toml
          command: check bans licenses sources
          arguments: --all-features --locked

      - name: Audit SDK Rust licenses and sources
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: sdk/Cargo.toml
          command: check bans licenses sources
          arguments: --all-features --locked

      - name: Install pinned CycloneDX generator
        run: cargo install cargo-cyclonedx --version 0.5.9 --locked

      - name: Generate and validate Windows and macOS product SBOMs
        shell: bash
        run: |
          cargo cyclonedx --manifest-path Cargo.toml --format json --all-features --target x86_64-pc-windows-msvc --spec-version 1.5 --override-filename root-windows-sbom.cdx
          cargo cyclonedx --manifest-path product/Cargo.toml --format json --all-features --target x86_64-pc-windows-msvc --spec-version 1.5 --override-filename windows-sbom.cdx
          cargo cyclonedx --manifest-path Cargo.toml --format json --all-features --target aarch64-apple-darwin --spec-version 1.5 --override-filename root-macos-sbom.cdx
          cargo cyclonedx --manifest-path product/Cargo.toml --format json --all-features --target aarch64-apple-darwin --spec-version 1.5 --override-filename macos-sbom.cdx
          mapfile -t sboms < <(find product \( -name windows-sbom.cdx.json -o -name macos-sbom.cdx.json \) -type f -print)
          node tools/compliance/verify-cyclonedx.mjs root-windows-sbom.cdx.json root-macos-sbom.cdx.json "${sboms[@]}"

      - name: Generate locked Rust dependency notice and enforce forbidden direct dependencies
        run: |
          node tools/compliance/generate-rust-notice.mjs Cargo.toml "${{ runner.temp }}/binding-generator-rust-notice.txt"
          node tools/compliance/generate-rust-notice.mjs product/Cargo.toml "${{ runner.temp }}/product-rust-notice.txt"

  verify:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2025
            expected_arch: x86_64
          - name: macOS Apple Silicon
            os: macos-15
            expected_arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify runner architecture
        shell: bash
        run: |
          actual_arch="$(uname -m)"
          test "$actual_arch" = "${{ matrix.expected_arch }}"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.12.0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.17.0
          run_install: false

      - name: Setup Rust
        shell: bash
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify licensing
        shell: bash
        run: |
          python -m pip install "reuse[charset-normalizer]==6.2.0"
          reuse lint

      - name: Verify dependency direction
        run: pnpm run check:boundaries

      - name: Format Rust
        shell: bash
        run: |
          cargo fmt --manifest-path Cargo.toml --all -- --check
          cargo fmt --manifest-path sdk/Cargo.toml --all -- --check
          cargo fmt --manifest-path product/Cargo.toml --all -- --check

      - name: Lint Rust
        shell: bash
        run: |
          cargo clippy --manifest-path Cargo.toml --all-targets --locked -- -D warnings
          cargo clippy --manifest-path sdk/Cargo.toml --workspace --all-targets --all-features --locked -- -D warnings
          cargo clippy --manifest-path product/Cargo.toml --workspace --all-targets --all-features --locked -- -D warnings

      - name: Test platform-neutral Rust
        shell: bash
        run: |
          cargo test --manifest-path Cargo.toml --locked
          cargo test --manifest-path sdk/Cargo.toml --workspace --all-features --locked

      - name: Build and verify C/C++ Capture SDK
        shell: bash
        run: |
          asan=OFF
          platform=windows-x64
          if [ "${RUNNER_OS}" = "macOS" ]; then
            asan=ON
            platform=macos-arm64
            export MACOSX_DEPLOYMENT_TARGET=14.0
          fi
          cargo build --manifest-path sdk/Cargo.toml --package snaploom-capture-c-abi --release --locked
          node tools/architecture/check-abi-symbols.mjs
          cmake -S sdk/tests/cpp -B "${RUNNER_TEMP}/snaploom-cpp-tests" -DSNAPLOOM_ENABLE_ASAN="${asan}" -DCMAKE_BUILD_TYPE=Release
          cmake --build "${RUNNER_TEMP}/snaploom-cpp-tests" --config Release
          ctest --test-dir "${RUNNER_TEMP}/snaploom-cpp-tests" --build-config Release --output-on-failure
          archive="$(node tools/sdk/package-c-sdk.mjs --platform "${platform}" --output "${RUNNER_TEMP}/snaploom-sdk-package")"
          node tools/sdk/verify-c-sdk.mjs --platform "${platform}" --archive "${archive}"

      - name: Test product Rust
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cargo test --manifest-path product/Cargo.toml --workspace --all-features --locked

      # GitHub's Windows image is Windows Server rather than a supported
      # interactive Windows 10/11 desktop. Link every product test here, then
      # execute the same test suite on macOS and reserve WGC execution for the
      # documented Windows 10/11 true-machine matrix.
      - name: Compile Windows product Rust tests
        if: runner.os == 'Windows'
        shell: bash
        run: cargo test --manifest-path product/Cargo.toml --workspace --all-features --locked --no-run

      - name: Verify generated Windows bindings
        shell: bash
        run: cargo run --manifest-path Cargo.toml --locked --bin windows-bindings -- --check

      - name: Verify frontend
        run: pnpm run check

      - name: Build Desktop Tauri binary
        run: pnpm run tauri:desktop

      - name: Build Capture Host Tauri binary
        run: pnpm run tauri:host
