[package]
name = "snaploom-capture-host"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lib]
name = "snaploom_capture_host_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "snaploom-capture-host"
path = "src/main.rs"
required-features = ["tauri-runtime"]

[features]
default = ["tauri-runtime"]
tauri-runtime = ["dep:tauri"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
getrandom.workspace = true
prost.workspace = true
png.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { workspace = true, optional = true }
tauri-plugin-dialog.workspace = true
snaploom-capture-session = { path = "../../capture-session", version = "=0.1.0" }
snaploom-platform-contract = { path = "../../platform/contract", version = "=0.1.0" }
snaploom-capture-client = { path = "../../../sdk/client", version = "=0.1.0" }
snaploom-capture-protocol = { path = "../../../sdk/protocol", version = "=0.1.0" }
snaploom-platform-fake = { path = "../../platform/fake", version = "=0.1.0" }
zeroize.workspace = true

[target.'cfg(windows)'.dependencies]
snaploom-platform-windows = { path = "../../platform/windows", version = "=0.1.0", features = ["tauri-shell"] }

[target.'cfg(target_os = "macos")'.dependencies]
snaploom-platform-macos = { path = "../../platform/macos", version = "=0.1.0", features = ["tauri-shell"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
snaploom-capture-client = { path = "../../../sdk/client", version = "=0.1.0" }
snaploom-platform-macos = { path = "../../platform/macos", version = "=0.1.0", features = ["tauri-shell"] }
snaploom-platform-windows = { path = "../../platform/windows", version = "=0.1.0", features = ["tauri-shell"] }
