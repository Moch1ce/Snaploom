[workspace]
members = [
  "apps/desktop",
  "apps/capture-host",
  "capture-session",
  "desktop-shell",
  "platform/contract",
  "platform/fake",
  "platform/macos",
  "platform/windows",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["Snaploom contributors"]
repository = "https://github.com/moch1ce/Snaploom"

[workspace.dependencies]
getrandom = "0.4.3"
libc = "0.2.187"
prost = "0.14.4"
png = "=0.18.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
time = { version = "=0.3.54", features = ["formatting"] }
tauri = { version = "=2.11.5", features = ["tray-icon"] }
tauri-build = { version = "=2.6.3", features = [] }
tauri-plugin-dialog = "=2.7.2"
tauri-plugin-autostart = "=2.5.1"
tauri-plugin-global-shortcut = "=2.3.2"
tauri-plugin-notification = "=2.3.3"
tauri-plugin-opener = "=2.5.4"
tauri-plugin-single-instance = "=2.4.3"
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "native-tls"] }
block2 = "=0.6.2"
objc2 = "=0.6.4"
objc2-app-kit = "=0.3.2"
objc2-core-foundation = "=0.3.2"
objc2-core-graphics = "=0.3.2"
objc2-core-media = "=0.3.2"
objc2-core-video = "=0.3.2"
objc2-foundation = "=0.3.2"
objc2-screen-capture-kit = "=0.3.2"
objc2-service-management = "=0.3.2"
zeroize = "1.8.1"
