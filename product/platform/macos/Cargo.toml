[package]
name = "snaploom-platform-macos"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[features]
default = []
tauri-shell = ["dep:tauri", "dep:tauri-plugin-dialog"]
desktop-shell = [
  "tauri-shell",
  "dep:tauri-plugin-global-shortcut",
  "dep:tauri-plugin-notification",
]

[dependencies]
getrandom.workspace = true
snaploom-platform-contract = { path = "../contract", version = "=0.1.0" }
tauri = { workspace = true, optional = true }
tauri-plugin-dialog = { workspace = true, optional = true }
tauri-plugin-global-shortcut = { workspace = true, optional = true }
tauri-plugin-notification = { workspace = true, optional = true }
zeroize.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
block2.workspace = true
objc2.workspace = true
objc2-app-kit.workspace = true
objc2-core-foundation.workspace = true
objc2-core-graphics.workspace = true
objc2-core-media.workspace = true
objc2-core-video.workspace = true
objc2-foundation.workspace = true
objc2-screen-capture-kit.workspace = true
objc2-service-management.workspace = true
