syntax = "proto3";

package snaploom.capture.v1;

enum ClipboardMode {
  CLIPBOARD_MODE_DEFAULT_ENABLED = 0;
  CLIPBOARD_MODE_DISABLED = 1;
}

enum CaptureOrigin {
  CAPTURE_ORIGIN_UNSPECIFIED = 0;
  CAPTURE_ORIGIN_APP = 1;
  CAPTURE_ORIGIN_SDK = 2;
}

enum UiLanguage {
  UI_LANGUAGE_SYSTEM = 0;
  UI_LANGUAGE_ZH_CN = 1;
  UI_LANGUAGE_EN = 2;
}

enum ClipboardOutcome {
  CLIPBOARD_OUTCOME_UNSPECIFIED = 0;
  CLIPBOARD_OUTCOME_WRITTEN = 1;
  CLIPBOARD_OUTCOME_DISABLED = 2;
}

enum CancelSource {
  CANCEL_SOURCE_UNSPECIFIED = 0;
  CANCEL_SOURCE_CALLER = 1;
  CANCEL_SOURCE_USER = 2;
  CANCEL_SOURCE_CLIENT_DISCONNECTED = 3;
}

enum PermissionAction {
  PERMISSION_ACTION_UNSPECIFIED = 0;
  PERMISSION_ACTION_QUERY = 1;
  PERMISSION_ACTION_REQUEST = 2;
  PERMISSION_ACTION_OPEN_SETTINGS = 3;
}

enum PermissionState {
  PERMISSION_STATE_UNSPECIFIED = 0;
  PERMISSION_STATE_GRANTED = 1;
  PERMISSION_STATE_NOT_GRANTED = 2;
  PERMISSION_STATE_RESTART_REQUIRED = 3;
  PERMISSION_STATE_NOT_APPLICABLE = 4;
}

enum StableError {
  STABLE_ERROR_NONE = 0;
  STABLE_ERROR_BUSY = 1;
  STABLE_ERROR_HOST_NOT_FOUND = 2;
  STABLE_ERROR_HOST_START_FAILED = 3;
  STABLE_ERROR_HOST_START_TIMEOUT = 4;
  STABLE_ERROR_AUTHENTICATION_FAILED = 5;
  STABLE_ERROR_PROTOCOL_INCOMPATIBLE = 6;
  STABLE_ERROR_PROTOCOL_ERROR = 7;
  STABLE_ERROR_HOST_CRASHED = 8;
  STABLE_ERROR_TRANSPORT_FAILED = 9;
  STABLE_ERROR_HANDSHAKE_TIMEOUT = 10;
  STABLE_ERROR_REQUEST_TIMEOUT = 11;
  STABLE_ERROR_PLATFORM_UNAVAILABLE = 20;
  STABLE_ERROR_PERMISSION_NOT_GRANTED = 21;
  STABLE_ERROR_PERMISSION_REVOKED = 22;
  STABLE_ERROR_DISPLAY_UNAVAILABLE = 23;
  STABLE_ERROR_CAPTURE_UNAVAILABLE = 24;
  STABLE_ERROR_CAPTURE_TIMEOUT = 25;
  STABLE_ERROR_PIXEL_CONVERSION_FAILED = 26;
  STABLE_ERROR_INVALID_RESULT = 30;
  STABLE_ERROR_RESULT_TOO_LARGE = 31;
  STABLE_ERROR_CLIPBOARD_WRITE_FAILED = 32;
  STABLE_ERROR_OUT_OF_MEMORY = 40;
  STABLE_ERROR_CLIENT_CLOSED = 41;
  STABLE_ERROR_INTERNAL = 255;
}

message Hello {
  uint32 protocol_major = 1;
  uint32 min_protocol_minor = 2;
  uint32 max_protocol_minor = 3;
  bytes client_nonce = 4;
  string sdk_semver = 5;
  uint64 requested_capabilities = 6;
}

message Welcome {
  uint32 protocol_major = 1;
  uint32 negotiated_protocol_minor = 2;
  bytes echoed_client_nonce = 3;
  bytes connection_id = 4;
  string host_semver = 5;
  uint64 capabilities = 6;
  uint32 max_frame_bytes = 7;
  uint64 max_png_bytes = 8;
}

message StartCapture {
  bytes request_id = 1;
  ClipboardMode clipboard_mode = 2;
  optional uint64 interaction_timeout_ms = 3;
  CaptureOrigin origin = 4;
  UiLanguage language = 5;
}

message CaptureAccepted { bytes request_id = 1; }
message CaptureRejected { bytes request_id = 1; StableError error = 2; }
message CancelCapture { bytes request_id = 1; }
message CancelAcknowledged { bytes request_id = 1; }

message ResultBegin {
  bytes request_id = 1;
  uint64 png_length = 2;
  uint32 pixel_width = 3;
  uint32 pixel_height = 4;
  ClipboardOutcome clipboard = 5;
}

message ResultChunk { bytes request_id = 1; uint64 offset = 2; bytes data = 3; }
message ResultEnd { bytes request_id = 1; }
message CaptureCanceled { bytes request_id = 1; CancelSource source = 2; }
message CaptureFailed { bytes request_id = 1; StableError error = 2; bool retryable = 3; }
message PermissionCommand { PermissionAction action = 1; }
message PermissionResult { PermissionState state = 1; StableError error = 2; }

message Envelope {
  bytes connection_id = 1;
  uint64 sequence = 2;
  oneof body {
    Hello hello = 10;
    Welcome welcome = 11;
    StartCapture start_capture = 12;
    CaptureAccepted capture_accepted = 13;
    CaptureRejected capture_rejected = 14;
    CancelCapture cancel_capture = 15;
    CancelAcknowledged cancel_acknowledged = 16;
    ResultBegin result_begin = 17;
    ResultChunk result_chunk = 18;
    ResultEnd result_end = 19;
    CaptureCanceled capture_canceled = 20;
    CaptureFailed capture_failed = 21;
    PermissionCommand permission_command = 22;
    PermissionResult permission_result = 23;
  }
}
