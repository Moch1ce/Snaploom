[workspace]
members = ["protocol", "client", "c-abi", "testkit/fake-host"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["Snaploom contributors"]
repository = "https://github.com/moch1ce/Snaploom"

[workspace.dependencies]
getrandom = "0.4.3"
prost = "0.14.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
zeroize = "1.9.0"
